[project]
name = "pdf-assist"
version = "0.1.0"
description = "PDF read-aloud reviewer backend"
requires-python = ">=3.12"
dependencies = [
    "en-core-web-sm ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "kokoro-onnx>=0.6.1",
    "misaki[en]>=0.9.4 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "mlx-audio>=0.6.5 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "pydantic>=2.14.3",
    "pymupdf>=2.1",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]
